<svg xmlns="http://www.w3.org/2000/svg" width="760" height="340" viewBox="0 0 760 340" role="img" aria-labelledby="title desc">
  <title id="title">シェルピンスキーの三角形の段階</title>
  <desc id="desc">正三角形の中央を抜く操作を繰り返すと自己相似な三角形が現れる。</desc>
  <rect width="760" height="340" fill="#fbfaf7"/>
  <text x="38" y="44" font-family="sans-serif" font-size="24" font-weight="700" fill="#2b2b2b">同じ操作をくり返すと、同じ形が中に現れる</text>
  <defs>
    <g id="tri1"><polygon points="75,0 150,130 0,130" fill="#8ecae6" opacity=".55" stroke="#263238" stroke-width="3"/></g>
    <g id="tri2">
      <polygon points="75,0 150,130 0,130" fill="#8ecae6" opacity=".55" stroke="#263238" stroke-width="3"/>
      <polygon points="75,65 112.5,130 37.5,130" fill="#fbfaf7" stroke="#e76f51" stroke-width="2"/>
    </g>
    <g id="tri3">
      <use href="#tri2"/>
      <polygon points="37.5,65 56.25,97.5 18.75,97.5" fill="#fbfaf7" stroke="#e76f51" stroke-width="1.5"/>
      <polygon points="112.5,65 131.25,97.5 93.75,97.5" fill="#fbfaf7" stroke="#e76f51" stroke-width="1.5"/>
      <polygon points="75,130 93.75,97.5 56.25,97.5" fill="#fbfaf7" stroke="#e76f51" stroke-width="1.5"/>
    </g>
  </defs>
  <g transform="translate(92 98)"><use href="#tri1"/><text x="44" y="170" font-family="sans-serif" font-size="16" fill="#333">0回</text></g>
  <path d="M270 166h54" stroke="#555" stroke-width="3" marker-end="url(#arrow)"/>
  <g transform="translate(350 98)"><use href="#tri2"/><text x="44" y="170" font-family="sans-serif" font-size="16" fill="#333">1回</text></g>
  <path d="M528 166h54" stroke="#555" stroke-width="3" marker-end="url(#arrow)"/>
  <g transform="translate(608 98)"><use href="#tri3"/><text x="44" y="170" font-family="sans-serif" font-size="16" fill="#333">2回</text></g>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#555"/></marker></defs>
  <text x="130" y="306" font-family="sans-serif" font-size="16" fill="#555">中央を抜く。同じことを残った3つの三角形にくり返す。</text>
</svg>
