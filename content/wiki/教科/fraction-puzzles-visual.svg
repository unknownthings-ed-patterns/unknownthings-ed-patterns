<svg xmlns="http://www.w3.org/2000/svg" width="980" height="640" viewBox="0 0 980 640" role="img" aria-labelledby="title desc">
  <title id="title">分数パズルの見方</title>
  <desc id="desc">12かける12の正方形を縦に分け、左の長方形では24/96が1/4、右の長方形では16/48が1/3になることを示す図解。</desc>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#b9c3cf" stroke-width="1.5"/>
    </pattern>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#1d2733" flood-opacity="0.16"/>
    </filter>
  </defs>

  <rect width="980" height="640" rx="24" fill="#f7fafc"/>

  <text x="56" y="58" font-family="-apple-system, BlinkMacSystemFont, 'Hiragino Sans', 'Yu Gothic', sans-serif" font-size="30" font-weight="700" fill="#1f2937">分数パズルの見方</text>
  <text x="56" y="92" font-family="-apple-system, BlinkMacSystemFont, 'Hiragino Sans', 'Yu Gothic', sans-serif" font-size="17" fill="#526071">1本の線で分けた2つの長方形で、色の部分の割合を見る</text>

  <g filter="url(#shadow)">
    <rect x="60" y="122" width="480" height="480" fill="#ffffff" stroke="#1f2937" stroke-width="3"/>
    <rect x="60" y="122" width="320" height="120" fill="#5aa9e6" opacity="0.78"/>
    <rect x="380" y="122" width="160" height="160" fill="#79c267" opacity="0.78"/>
    <rect x="60" y="122" width="480" height="480" fill="url(#grid)"/>
    <rect x="60" y="122" width="480" height="480" fill="none" stroke="#1f2937" stroke-width="3"/>
    <line x1="380" y1="122" x2="380" y2="602" stroke="#111827" stroke-width="6"/>
  </g>

  <text x="138" y="630" font-family="-apple-system, BlinkMacSystemFont, 'Hiragino Sans', 'Yu Gothic', sans-serif" font-size="17" font-weight="700" fill="#245b86">左の長方形</text>
  <text x="400" y="630" font-family="-apple-system, BlinkMacSystemFont, 'Hiragino Sans', 'Yu Gothic', sans-serif" font-size="17" font-weight="700" fill="#3d7033">右の長方形</text>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Hiragino Sans', 'Yu Gothic', sans-serif">
    <rect x="590" y="126" width="330" height="118" rx="14" fill="#eef7ff" stroke="#78add8"/>
    <text x="614" y="162" font-size="20" font-weight="700" fill="#245b86">左の長方形</text>
    <text x="614" y="196" font-size="26" font-weight="700" fill="#1f2937">24 / 96 = 1 / 4</text>
    <text x="614" y="224" font-size="16" fill="#526071">96マス中24マスが色つき</text>

    <rect x="590" y="270" width="330" height="118" rx="14" fill="#f0faed" stroke="#86bd77"/>
    <text x="614" y="306" font-size="20" font-weight="700" fill="#3d7033">右の長方形</text>
    <text x="614" y="340" font-size="26" font-weight="700" fill="#1f2937">16 / 48 = 1 / 3</text>
    <text x="614" y="368" font-size="16" fill="#526071">48マス中16マスが色つき</text>

    <rect x="590" y="414" width="330" height="118" rx="14" fill="#fff7ed" stroke="#e1a35e"/>
    <text x="614" y="450" font-size="20" font-weight="700" fill="#9a5a16">授業での問い</text>
    <text x="614" y="484" font-size="18" fill="#1f2937">何個中、何個が色つき？</text>
    <text x="614" y="512" font-size="18" fill="#1f2937">同じ分数に言い換えられる？</text>
  </g>

  <text x="590" y="586" font-family="-apple-system, BlinkMacSystemFont, 'Hiragino Sans', 'Yu Gothic', sans-serif" font-size="13" fill="#667085">wiki用に作成したオリジナル図解。</text>
  <text x="590" y="606" font-family="-apple-system, BlinkMacSystemFont, 'Hiragino Sans', 'Yu Gothic', sans-serif" font-size="13" fill="#667085">元タスク: youcubed.org Fraction Puzzles (CC BY-NC 4.0)</text>
</svg>
