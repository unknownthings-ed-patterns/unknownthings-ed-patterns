<svg xmlns="http://www.w3.org/2000/svg" width="760" height="300" viewBox="0 0 760 300" role="img" aria-labelledby="title desc">
  <title id="title">6の中に1/2はいくつ入るか</title>
  <desc id="desc">0から6までの数直線を1/2刻みに分け、6割る1/2が12になることを示す図。</desc>
  <rect width="760" height="300" fill="#fbfaf7"/>
  <text x="38" y="44" font-family="sans-serif" font-size="24" font-weight="700" fill="#2b2b2b">6Lの中に、1/2Lは何個入る？</text>
  <line x1="80" y1="145" x2="680" y2="145" stroke="#263238" stroke-width="4" stroke-linecap="round"/>
  <g font-family="sans-serif" font-size="16" fill="#333" text-anchor="middle">
    <line x1="80" y1="130" x2="80" y2="160" stroke="#263238" stroke-width="3"/><text x="80" y="190">0</text>
    <line x1="180" y1="130" x2="180" y2="160" stroke="#263238" stroke-width="3"/><text x="180" y="190">1</text>
    <line x1="280" y1="130" x2="280" y2="160" stroke="#263238" stroke-width="3"/><text x="280" y="190">2</text>
    <line x1="380" y1="130" x2="380" y2="160" stroke="#263238" stroke-width="3"/><text x="380" y="190">3</text>
    <line x1="480" y1="130" x2="480" y2="160" stroke="#263238" stroke-width="3"/><text x="480" y="190">4</text>
    <line x1="580" y1="130" x2="580" y2="160" stroke="#263238" stroke-width="3"/><text x="580" y="190">5</text>
    <line x1="680" y1="130" x2="680" y2="160" stroke="#263238" stroke-width="3"/><text x="680" y="190">6</text>
  </g>
  <g stroke="#e76f51" stroke-width="2">
    <line x1="130" y1="136" x2="130" y2="154"/><line x1="230" y1="136" x2="230" y2="154"/>
    <line x1="330" y1="136" x2="330" y2="154"/><line x1="430" y1="136" x2="430" y2="154"/>
    <line x1="530" y1="136" x2="530" y2="154"/><line x1="630" y1="136" x2="630" y2="154"/>
  </g>
  <g fill="#8ecae6" opacity=".8">
    <rect x="80" y="88" width="50" height="18" rx="4"/><rect x="130" y="88" width="50" height="18" rx="4"/>
    <rect x="180" y="88" width="50" height="18" rx="4"/><rect x="230" y="88" width="50" height="18" rx="4"/>
    <rect x="280" y="88" width="50" height="18" rx="4"/><rect x="330" y="88" width="50" height="18" rx="4"/>
    <rect x="380" y="88" width="50" height="18" rx="4"/><rect x="430" y="88" width="50" height="18" rx="4"/>
    <rect x="480" y="88" width="50" height="18" rx="4"/><rect x="530" y="88" width="50" height="18" rx="4"/>
    <rect x="580" y="88" width="50" height="18" rx="4"/><rect x="630" y="88" width="50" height="18" rx="4"/>
  </g>
  <text x="250" y="245" font-family="sans-serif" font-size="18" fill="#333">1/2ずつ数えると12個。だから 6 ÷ 1/2 = 12。</text>
</svg>
