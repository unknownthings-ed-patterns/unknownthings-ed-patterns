<svg xmlns="http://www.w3.org/2000/svg" width="760" height="420" viewBox="0 0 760 420" role="img" aria-labelledby="title desc">
  <title id="title">紙を折ると厚さが指数的に増える</title>
  <desc id="desc">紙を折る回数と厚さを棒グラフで示し、直線ではなく倍々に増えることを表す。</desc>
  <rect width="760" height="420" fill="#fbfaf7"/>
  <text x="38" y="44" font-family="sans-serif" font-size="24" font-weight="700" fill="#2b2b2b">1回折るごとに、厚さは2倍になる</text>
  <g transform="translate(92 82)">
    <line x1="0" y1="260" x2="590" y2="260" stroke="#263238" stroke-width="3"/>
    <line x1="0" y1="260" x2="0" y2="0" stroke="#263238" stroke-width="3"/>
    <g fill="#8ecae6" opacity=".75" stroke="#263238" stroke-width="2">
      <rect x="42" y="248" width="42" height="12"/>
      <rect x="122" y="238" width="42" height="22"/>
      <rect x="202" y="218" width="42" height="42"/>
      <rect x="282" y="178" width="42" height="82"/>
      <rect x="362" y="98" width="42" height="162"/>
      <rect x="442" y="18" width="42" height="242"/>
    </g>
    <g font-family="sans-serif" font-size="15" fill="#333" text-anchor="middle">
      <text x="63" y="288">0回</text><text x="143" y="288">1回</text><text x="223" y="288">2回</text>
      <text x="303" y="288">3回</text><text x="383" y="288">4回</text><text x="463" y="288">5回</text>
      <text x="63" y="238">0.1</text><text x="143" y="228">0.2</text><text x="223" y="208">0.4</text>
      <text x="303" y="168">0.8</text><text x="383" y="88">1.6</text><text x="463" y="8">3.2mm</text>
    </g>
    <path d="M520 70 C570 40 610 40 640 70" fill="none" stroke="#e76f51" stroke-width="3" marker-end="url(#arrow)"/>
    <text x="522" y="112" font-family="sans-serif" font-size="16" fill="#e76f51">10回ごとに約1000倍</text>
  </g>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#e76f51"/></marker></defs>
  <text x="96" y="384" font-family="sans-serif" font-size="16" fill="#555">直線的に増えるのではなく、2倍、4倍、8倍……と一気に伸びる。</text>
</svg>
