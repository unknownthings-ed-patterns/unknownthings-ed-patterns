<svg xmlns="http://www.w3.org/2000/svg" width="760" height="380" viewBox="0 0 760 380" role="img" aria-labelledby="title desc">
  <title id="title">四角形の中点を結ぶ</title>
  <desc id="desc">任意の四角形の各辺の中点を結ぶと、内側に平行四辺形ができることを示す図。</desc>
  <rect width="760" height="380" fill="#fbfaf7"/>
  <text x="38" y="44" font-family="sans-serif" font-size="24" font-weight="700" fill="#2b2b2b">どんな四角形でも、中点を結ぶと平行四辺形</text>
  <g transform="translate(110 70)" stroke="#263238" stroke-width="4" fill="none">
    <polygon points="60,210 150,30 430,80 360,250"/>
    <line x1="105" y1="120" x2="290" y2="55" stroke="#bbb" stroke-width="2" stroke-dasharray="6 6"/>
    <line x1="290" y1="55" x2="395" y2="165" stroke="#bbb" stroke-width="2" stroke-dasharray="6 6"/>
    <line x1="395" y1="165" x2="210" y2="230" stroke="#bbb" stroke-width="2" stroke-dasharray="6 6"/>
    <line x1="210" y1="230" x2="105" y2="120" stroke="#bbb" stroke-width="2" stroke-dasharray="6 6"/>
    <polygon points="105,120 290,55 395,165 210,230" fill="#90be6d" opacity=".45" stroke="#e76f51" stroke-width="5"/>
    <g fill="#e76f51" stroke="#fff" stroke-width="2">
      <circle cx="105" cy="120" r="8"/><circle cx="290" cy="55" r="8"/><circle cx="395" cy="165" r="8"/><circle cx="210" cy="230" r="8"/>
    </g>
    <g fill="#263238" stroke="none" font-family="sans-serif" font-size="16">
      <text x="84" y="105">中点</text><text x="300" y="46">中点</text><text x="405" y="180">中点</text><text x="188" y="255">中点</text>
    </g>
  </g>
  <text x="120" y="340" font-family="sans-serif" font-size="16" fill="#555">見た目がいびつでも、内側の四角形は向かい合う辺が平行になる。</text>
</svg>
