<svg xmlns="http://www.w3.org/2000/svg" width="760" height="340" viewBox="0 0 760 340" role="img" aria-labelledby="title desc">
  <title id="title">平行四辺形を長方形に変換する</title>
  <desc id="desc">平行四辺形の端を切って反対側へ移すと長方形になる模式図。</desc>
  <rect width="760" height="340" fill="#fbfaf7"/>
  <text x="38" y="42" font-family="sans-serif" font-size="24" font-weight="700" fill="#2b2b2b">切って移すと、面積は変わらない</text>
  <g transform="translate(80 95)" stroke="#263238" stroke-width="3" fill="#8ecae6" opacity=".55">
    <path d="M60 0 H240 L180 130 H0 Z"/>
    <path d="M60 0 L0 130" stroke="#e76f51" stroke-width="4" stroke-dasharray="8 6" fill="none"/>
    <text x="70" y="165" font-family="sans-serif" font-size="16" fill="#333" stroke="none">平行四辺形</text>
  </g>
  <path d="M350 155h90" stroke="#555" stroke-width="3" marker-end="url(#arrow)"/>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#555"/></marker></defs>
  <g transform="translate(470 95)" stroke="#263238" stroke-width="3">
    <rect x="0" y="0" width="240" height="130" fill="#90be6d" opacity=".45"/>
    <path d="M0 0 L60 0 L0 130 Z" fill="#ffd166" opacity=".7"/>
    <line x1="0" y1="0" x2="0" y2="130" stroke="#e76f51" stroke-width="4" stroke-dasharray="8 6"/>
    <text x="50" y="165" font-family="sans-serif" font-size="16" fill="#333" stroke="none">長方形に変換</text>
  </g>
  <text x="90" y="300" font-family="sans-serif" font-size="16" fill="#555">斜めの辺ではなく、高さが面積を決める。底辺×高さへつなげる図。</text>
</svg>
