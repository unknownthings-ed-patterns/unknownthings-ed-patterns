<svg xmlns="http://www.w3.org/2000/svg" width="760" height="360" viewBox="0 0 760 360" role="img" aria-labelledby="title desc">
  <title id="title">奇数を足すと正方形になる</title>
  <desc id="desc">1、3、5、7個をL字型に追加すると正方形が大きくなる図。</desc>
  <rect width="760" height="360" fill="#fbfaf7"/>
  <text x="38" y="42" font-family="sans-serif" font-size="24" font-weight="700" fill="#2b2b2b">奇数を足すと正方形が育つ</text>
  <defs>
    <circle id="dot" r="9" fill="#457b9d"/>
  </defs>
  <g transform="translate(70 90)">
    <use href="#dot" x="0" y="0"/>
    <text x="-15" y="70" font-family="sans-serif" font-size="16">1</text>
  </g>
  <g transform="translate(210 80)">
    <use href="#dot" x="0" y="0"/><use href="#dot" x="28" y="0"/><use href="#dot" x="0" y="28"/><use href="#dot" x="28" y="28"/>
    <path d="M54 -12v64h-64" fill="none" stroke="#e76f51" stroke-width="4"/>
    <text x="-10" y="92" font-family="sans-serif" font-size="16">1+3=4</text>
  </g>
  <g transform="translate(390 70)">
    <use href="#dot" x="0" y="0"/><use href="#dot" x="28" y="0"/><use href="#dot" x="56" y="0"/>
    <use href="#dot" x="0" y="28"/><use href="#dot" x="28" y="28"/><use href="#dot" x="56" y="28"/>
    <use href="#dot" x="0" y="56"/><use href="#dot" x="28" y="56"/><use href="#dot" x="56" y="56"/>
    <path d="M82 -12v92h-92" fill="none" stroke="#e76f51" stroke-width="4"/>
    <text x="-18" y="120" font-family="sans-serif" font-size="16">1+3+5=9</text>
  </g>
  <g transform="translate(590 60)">
    <rect x="-12" y="-12" width="108" height="108" fill="#ffd166" opacity=".25"/>
    <path d="M96 -16v116h-116" fill="none" stroke="#e76f51" stroke-width="4"/>
    <text x="-42" y="137" font-family="sans-serif" font-size="16">次は+7で16</text>
  </g>
  <text x="58" y="308" font-family="sans-serif" font-size="16" fill="#555">前の正方形に、次の奇数個をL字型に足すと、次の正方形になる。</text>
</svg>
