<svg xmlns="http://www.w3.org/2000/svg" width="760" height="360" viewBox="0 0 760 360" role="img" aria-labelledby="title desc">
  <title id="title">直方体の展開図で表面積を考える</title>
  <desc id="desc">3cm、4cm、5cmの直方体を展開図にして、同じ面が2枚ずつあることを示す。</desc>
  <rect width="760" height="360" fill="#fbfaf7"/>
  <text x="38" y="44" font-family="sans-serif" font-size="24" font-weight="700" fill="#2b2b2b">全部の面を開いて、面積を足す</text>
  <g transform="translate(82 92)" stroke="#263238" stroke-width="3">
    <path d="M0 45 L90 0 L170 35 L170 135 L80 180 L0 140 Z" fill="#8ecae6" opacity=".45"/>
    <path d="M0 45 L80 85 L170 35" fill="none"/>
    <path d="M80 85 L80 180" fill="none"/>
    <text x="28" y="214" font-family="sans-serif" font-size="16" fill="#333" stroke="none">直方体</text>
  </g>
  <path d="M300 175h70" stroke="#555" stroke-width="3" marker-end="url(#arrow)"/>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#555"/></marker></defs>
  <g transform="translate(420 86)" stroke="#263238" stroke-width="2">
    <rect x="80" y="0" width="96" height="72" fill="#ffd166" opacity=".75"/>
    <rect x="80" y="72" width="96" height="120" fill="#90be6d" opacity=".55"/>
    <rect x="176" y="72" width="72" height="120" fill="#8ecae6" opacity=".55"/>
    <rect x="248" y="72" width="96" height="120" fill="#90be6d" opacity=".55"/>
    <rect x="8" y="72" width="72" height="120" fill="#8ecae6" opacity=".55"/>
    <rect x="80" y="192" width="96" height="72" fill="#ffd166" opacity=".75"/>
    <g font-family="sans-serif" font-size="14" fill="#333" text-anchor="middle" stroke="none">
      <text x="128" y="43">3×4</text><text x="128" y="137">4×5</text><text x="212" y="137">3×5</text>
      <text x="296" y="137">4×5</text><text x="44" y="137">3×5</text><text x="128" y="235">3×4</text>
    </g>
  </g>
  <text x="120" y="322" font-family="sans-serif" font-size="16" fill="#555">3種類の面がそれぞれ2枚。表面積は外側にある面積の合計。</text>
</svg>
