<svg xmlns="http://www.w3.org/2000/svg" width="760" height="320" viewBox="0 0 760 320" role="img" aria-labelledby="title desc">
  <title id="title">紙を折って作れる分数</title>
  <desc id="desc">半分折りを繰り返すと2等分、4等分、8等分になる図。</desc>
  <rect width="760" height="320" fill="#fbfaf7"/>
  <text x="38" y="42" font-family="sans-serif" font-size="24" font-weight="700" fill="#2b2b2b">折るたびに等分の数が2倍になる</text>
  <g transform="translate(70 85)" font-family="sans-serif" font-size="16" fill="#333" stroke="#263238" stroke-width="2">
    <g>
      <rect width="600" height="44" fill="#8ecae6" opacity=".35"/>
      <line x1="300" y1="0" x2="300" y2="44" stroke-dasharray="6 5"/>
      <text x="0" y="74" stroke="none">1回折る：1/2</text>
    </g>
    <g transform="translate(0 100)">
      <rect width="600" height="44" fill="#90be6d" opacity=".35"/>
      <line x1="150" y1="0" x2="150" y2="44"/><line x1="300" y1="0" x2="300" y2="44"/><line x1="450" y1="0" x2="450" y2="44"/>
      <text x="0" y="74" stroke="none">2回折る：1/4, 3/4</text>
    </g>
    <g transform="translate(0 200)">
      <rect width="600" height="44" fill="#ffd166" opacity=".35"/>
      <path d="M75 0v44M150 0v44M225 0v44M300 0v44M375 0v44M450 0v44M525 0v44"/>
      <text x="0" y="74" stroke="none">3回折る：1/8, 3/8, 5/8...</text>
    </g>
  </g>
</svg>
