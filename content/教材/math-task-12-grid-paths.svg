<svg xmlns="http://www.w3.org/2000/svg" width="760" height="360" viewBox="0 0 760 360" role="img" aria-labelledby="title desc">
  <title id="title">グリッドを歩く道の数</title>
  <desc id="desc">右か上に進むグリッドに、各点までの道の数を書き込む図。</desc>
  <rect width="760" height="360" fill="#fbfaf7"/>
  <text x="38" y="42" font-family="sans-serif" font-size="24" font-weight="700" fill="#2b2b2b">各点までの道の数を書き込む</text>
  <g transform="translate(120 85)" stroke="#263238" stroke-width="3" fill="none">
    <path d="M0 0h300M0 75h300M0 150h300M0 225h300M0 0v225M75 0v225M150 0v225M225 0v225M300 0v225"/>
    <path d="M0 225 C75 205, 110 145, 150 150 S220 80, 300 0" stroke="#e76f51" stroke-width="5" fill="none" marker-end="url(#arrow)"/>
  </g>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#e76f51"/></marker></defs>
  <g transform="translate(120 85)" font-family="sans-serif" font-size="18" font-weight="700" fill="#457b9d" text-anchor="middle">
    <text x="-20" y="230">1</text><text x="55" y="230">1</text><text x="130" y="230">1</text><text x="205" y="230">1</text><text x="280" y="230">1</text>
    <text x="-20" y="155">1</text><text x="55" y="155">2</text><text x="130" y="155">3</text><text x="205" y="155">4</text><text x="280" y="155">5</text>
    <text x="-20" y="80">1</text><text x="55" y="80">3</text><text x="130" y="80">6</text><text x="205" y="80">10</text><text x="280" y="80">15</text>
    <text x="-20" y="5">1</text><text x="55" y="5">4</text><text x="130" y="5">10</text><text x="205" y="5">20</text><text x="280" y="5">35</text>
  </g>
  <text x="500" y="150" font-family="sans-serif" font-size="18" fill="#333">左から来る数</text>
  <text x="540" y="182" font-family="sans-serif" font-size="18" fill="#333">+</text>
  <text x="500" y="214" font-family="sans-serif" font-size="18" fill="#333">下から来る数</text>
</svg>
