<svg xmlns="http://www.w3.org/2000/svg" width="760" height="380" viewBox="0 0 760 380" role="img" aria-labelledby="title desc">
  <title id="title">立方体でオイラーの多面体定理を数える</title>
  <desc id="desc">立方体の頂点、辺、面を色分けし、V-E+F=2を計算する図。</desc>
  <rect width="760" height="380" fill="#fbfaf7"/>
  <text x="38" y="44" font-family="sans-serif" font-size="24" font-weight="700" fill="#2b2b2b">頂点・辺・面を数えると、いつも 2 が出る</text>
  <g transform="translate(120 82)" stroke="#263238" stroke-width="4" fill="none">
    <polygon points="40,80 180,20 300,90 160,155" fill="#8ecae6" opacity=".25"/>
    <polygon points="40,80 160,155 160,290 40,210" fill="#90be6d" opacity=".25"/>
    <polygon points="160,155 300,90 300,220 160,290" fill="#ffd166" opacity=".45"/>
    <line x1="40" y1="80" x2="40" y2="210"/><line x1="180" y1="20" x2="180" y2="145" stroke-dasharray="6 6"/>
    <line x1="300" y1="90" x2="300" y2="220"/><line x1="40" y1="210" x2="160" y2="290"/>
    <line x1="160" y1="290" x2="300" y2="220"/><line x1="180" y1="145" x2="300" y2="220" stroke-dasharray="6 6"/>
    <line x1="180" y1="145" x2="40" y2="210" stroke-dasharray="6 6"/>
    <g fill="#e76f51" stroke="#fff" stroke-width="2">
      <circle cx="40" cy="80" r="8"/><circle cx="180" cy="20" r="8"/><circle cx="300" cy="90" r="8"/><circle cx="160" cy="155" r="8"/>
      <circle cx="40" cy="210" r="8"/><circle cx="180" cy="145" r="8"/><circle cx="300" cy="220" r="8"/><circle cx="160" cy="290" r="8"/>
    </g>
  </g>
  <g font-family="sans-serif" fill="#333">
    <text x="505" y="132" font-size="24" font-weight="700">立方体</text>
    <text x="505" y="178" font-size="22">V = 8</text>
    <text x="505" y="216" font-size="22">E = 12</text>
    <text x="505" y="254" font-size="22">F = 6</text>
    <text x="505" y="310" font-size="26" font-weight="700" fill="#e76f51">8 - 12 + 6 = 2</text>
  </g>
</svg>
