<svg xmlns="http://www.w3.org/2000/svg" width="760" height="360" viewBox="0 0 760 360" role="img" aria-labelledby="title desc">
  <title id="title">サンドイッチの樹形図</title>
  <desc id="desc">2種類のパンと3種類の具を組み合わせる樹形図。</desc>
  <rect width="760" height="360" fill="#fbfaf7"/>
  <text x="38" y="42" font-family="sans-serif" font-size="24" font-weight="700" fill="#2b2b2b">樹形図で漏れなく見る</text>
  <g font-family="sans-serif" font-size="18" fill="#333" stroke="#555" stroke-width="2">
    <text x="70" y="180" stroke="none">サンドイッチ</text>
    <line x1="190" y1="175" x2="310" y2="105"/><line x1="190" y1="175" x2="310" y2="245"/>
    <text x="320" y="110" stroke="none">食パン</text><text x="320" y="250" stroke="none">コッペパン</text>
    <g>
      <line x1="420" y1="105" x2="560" y2="70"/><line x1="420" y1="105" x2="560" y2="105"/><line x1="420" y1="105" x2="560" y2="140"/>
      <line x1="430" y1="245" x2="560" y2="215"/><line x1="430" y1="245" x2="560" y2="250"/><line x1="430" y1="245" x2="560" y2="285"/>
    </g>
    <text x="575" y="76" stroke="none">たまご</text><text x="575" y="111" stroke="none">ハム</text><text x="575" y="146" stroke="none">やさい</text>
    <text x="575" y="221" stroke="none">たまご</text><text x="575" y="256" stroke="none">ハム</text><text x="575" y="291" stroke="none">やさい</text>
  </g>
  <text x="70" y="325" font-family="sans-serif" font-size="16" fill="#555">2種類のパン × 3種類の具 = 6通り。枝の先を数えると漏れにくい。</text>
</svg>
