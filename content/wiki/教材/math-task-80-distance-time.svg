<svg xmlns="http://www.w3.org/2000/svg" width="760" height="420" viewBox="0 0 760 420" role="img" aria-labelledby="title desc">
  <title id="title">距離と時間のダイヤグラム</title>
  <desc id="desc">時間を横軸、距離を縦軸にして、移動・停止・再移動を表す折れ線グラフ。</desc>
  <rect width="760" height="420" fill="#fbfaf7"/>
  <text x="38" y="44" font-family="sans-serif" font-size="24" font-weight="700" fill="#2b2b2b">グラフの傾きが速さを表す</text>
  <g transform="translate(92 70)">
    <g stroke="#ddd" stroke-width="1">
      <path d="M0 280H560M0 210H560M0 140H560M0 70H560M0 0H560"/>
      <path d="M0 0V280M140 0V280M280 0V280M420 0V280M560 0V280"/>
    </g>
    <path d="M0 280H580" stroke="#263238" stroke-width="3"/>
    <path d="M0 280V-8" stroke="#263238" stroke-width="3"/>
    <polyline points="0,280 187,140 373,140 560,0" fill="none" stroke="#e76f51" stroke-width="5" stroke-linejoin="round"/>
    <g fill="#e76f51">
      <circle cx="0" cy="280" r="6"/><circle cx="187" cy="140" r="6"/><circle cx="373" cy="140" r="6"/><circle cx="560" cy="0" r="6"/>
    </g>
    <g font-family="sans-serif" font-size="14" fill="#333" text-anchor="middle">
      <text x="0" y="306">0分</text><text x="187" y="306">5分</text><text x="373" y="306">10分</text><text x="560" y="306">15分</text>
      <text x="-36" y="284">0m</text><text x="-48" y="144">1000m</text><text x="-48" y="4">2000m</text>
    </g>
    <text x="236" y="125" font-family="sans-serif" font-size="16" fill="#2a9d8f">水平＝止まっている</text>
    <text x="44" y="105" font-family="sans-serif" font-size="16" fill="#e76f51">急な線＝速い</text>
  </g>
</svg>
