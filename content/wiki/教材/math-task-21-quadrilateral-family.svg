<svg xmlns="http://www.w3.org/2000/svg" width="760" height="390" viewBox="0 0 760 390" role="img" aria-labelledby="title desc">
  <title id="title">四角形の大家族</title>
  <desc id="desc">四角形、台形、平行四辺形、長方形、ひし形、正方形の包含関係を表す図。</desc>
  <rect width="760" height="390" fill="#fbfaf7"/>
  <text x="38" y="42" font-family="sans-serif" font-size="24" font-weight="700" fill="#2b2b2b">四角形の大家族図</text>
  <g font-family="sans-serif" font-size="17" fill="#333" text-anchor="middle">
    <rect x="70" y="80" width="620" height="260" rx="22" fill="#e9ecef" stroke="#263238" stroke-width="2"/>
    <text x="380" y="110">四角形</text>
    <rect x="120" y="135" width="520" height="170" rx="18" fill="#bde0fe" opacity=".65" stroke="#457b9d" stroke-width="2"/>
    <text x="380" y="162">台形（少なくとも1組の向かい合う辺が平行）</text>
    <rect x="180" y="190" width="400" height="90" rx="16" fill="#90be6d" opacity=".55" stroke="#2a9d8f" stroke-width="2"/>
    <text x="380" y="216">平行四辺形</text>
    <ellipse cx="310" cy="250" rx="115" ry="45" fill="#ffd166" opacity=".65" stroke="#bc6c25" stroke-width="2"/>
    <text x="310" y="255">長方形</text>
    <ellipse cx="450" cy="250" rx="115" ry="45" fill="#f4a261" opacity=".55" stroke="#bc6c25" stroke-width="2"/>
    <text x="450" y="255">ひし形</text>
    <rect x="345" y="226" width="70" height="48" rx="6" fill="#ef476f" opacity=".68" stroke="#8d0801" stroke-width="2"/>
    <text x="380" y="257" fill="#111">正方形</text>
  </g>
  <text x="72" y="365" font-family="sans-serif" font-size="16" fill="#555">正方形は、長方形でもあり、ひし形でもある。条件が多いほど内側に入る。</text>
</svg>
