<svg xmlns="http://www.w3.org/2000/svg" width="760" height="420" viewBox="0 0 760 420" role="img" aria-labelledby="title desc">
  <title id="title">ピックの定理の格子点</title>
  <desc id="desc">格子点上の多角形で、内側の点と境界上の点を色分けして数える図。</desc>
  <rect width="760" height="420" fill="#fbfaf7"/>
  <text x="38" y="44" font-family="sans-serif" font-size="24" font-weight="700" fill="#2b2b2b">内側の点 I と、境界の点 B を数える</text>
  <g transform="translate(118 82)">
    <g stroke="#ddd" stroke-width="1">
      <path d="M0 0V280M40 0V280M80 0V280M120 0V280M160 0V280M200 0V280M240 0V280M280 0V280M320 0V280M360 0V280M400 0V280M440 0V280M480 0V280"/>
      <path d="M0 0H480M0 40H480M0 80H480M0 120H480M0 160H480M0 200H480M0 240H480M0 280H480"/>
    </g>
    <polygon points="80,240 160,80 360,40 440,200 240,240" fill="#8ecae6" opacity=".35" stroke="#263238" stroke-width="4"/>
    <g fill="#e76f51" stroke="#fff" stroke-width="2">
      <circle cx="80" cy="240" r="7"/><circle cx="120" cy="160" r="7"/><circle cx="160" cy="80" r="7"/>
      <circle cx="260" cy="60" r="7"/><circle cx="360" cy="40" r="7"/><circle cx="400" cy="120" r="7"/>
      <circle cx="440" cy="200" r="7"/><circle cx="340" cy="220" r="7"/><circle cx="240" cy="240" r="7"/><circle cx="160" cy="240" r="7"/>
    </g>
    <g fill="#2a9d8f" stroke="#fff" stroke-width="2">
      <circle cx="160" cy="160" r="7"/><circle cx="200" cy="120" r="7"/><circle cx="240" cy="120" r="7"/>
      <circle cx="280" cy="120" r="7"/><circle cx="320" cy="120" r="7"/><circle cx="200" cy="160" r="7"/>
      <circle cx="240" cy="160" r="7"/><circle cx="280" cy="160" r="7"/><circle cx="320" cy="160" r="7"/>
      <circle cx="200" cy="200" r="7"/><circle cx="240" cy="200" r="7"/><circle cx="280" cy="200" r="7"/><circle cx="320" cy="200" r="7"/>
    </g>
  </g>
  <g font-family="sans-serif" font-size="18" fill="#333">
    <circle cx="626" cy="150" r="8" fill="#2a9d8f"/><text x="646" y="156">内側の点 I</text>
    <circle cx="626" cy="190" r="8" fill="#e76f51"/><text x="646" y="196">境界の点 B</text>
    <text x="570" y="260" font-weight="700">A = I + B/2 - 1</text>
  </g>
</svg>
