<svg xmlns="http://www.w3.org/2000/svg" width="760" height="420" viewBox="0 0 760 420" role="img" aria-labelledby="title desc">
  <title id="title">追いかける問題の交点</title>
  <desc id="desc">兄と弟の距離時間グラフを描き、2本の直線の交点が追いつく時刻と距離を表す。</desc>
  <rect width="760" height="420" fill="#fbfaf7"/>
  <text x="38" y="44" font-family="sans-serif" font-size="24" font-weight="700" fill="#2b2b2b">2本の線が交わるところが「追いつく」瞬間</text>
  <g transform="translate(100 72)">
    <g stroke="#ddd" stroke-width="1">
      <path d="M0 280H540M0 210H540M0 140H540M0 70H540M0 0H540"/>
      <path d="M0 0V280M180 0V280M360 0V280M540 0V280"/>
    </g>
    <path d="M0 280H560" stroke="#263238" stroke-width="3"/>
    <path d="M0 280V-8" stroke="#263238" stroke-width="3"/>
    <line x1="0" y1="280" x2="540" y2="0" stroke="#2a9d8f" stroke-width="5"/>
    <line x1="180" y1="280" x2="540" y2="0" stroke="#e76f51" stroke-width="5"/>
    <circle cx="540" cy="0" r="8" fill="#f4a261" stroke="#263238" stroke-width="2"/>
    <path d="M540 0V280" stroke="#f4a261" stroke-width="2" stroke-dasharray="6 6"/>
    <path d="M0 0H540" stroke="#f4a261" stroke-width="2" stroke-dasharray="6 6"/>
    <g font-family="sans-serif" font-size="14" fill="#333" text-anchor="middle">
      <text x="0" y="306">8:00</text><text x="180" y="306">8:10</text><text x="540" y="306">8:30</text>
      <text x="-48" y="284">0m</text><text x="-56" y="4">2400m</text>
    </g>
    <text x="78" y="170" font-family="sans-serif" font-size="16" fill="#2a9d8f">兄：分速80m</text>
    <text x="282" y="188" font-family="sans-serif" font-size="16" fill="#e76f51">弟：分速120m</text>
    <text x="402" y="34" font-family="sans-serif" font-size="16" fill="#333">交点＝8:30、2400m</text>
  </g>
</svg>
