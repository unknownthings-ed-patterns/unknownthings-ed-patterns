<svg xmlns="http://www.w3.org/2000/svg" width="760" height="380" viewBox="0 0 760 380" role="img" aria-labelledby="title desc">
  <title id="title">二分探索で範囲を半分ずつ狭める</title>
  <desc id="desc">1から100までの数直線を、50、75、62、68と質問しながら半分ずつ狭める模式図。</desc>
  <rect width="760" height="380" fill="#fbfaf7"/>
  <text x="38" y="44" font-family="sans-serif" font-size="24" font-weight="700" fill="#2b2b2b">毎回「真ん中」を聞くと、範囲が半分になる</text>
  <g font-family="sans-serif" fill="#333">
    <g transform="translate(86 92)">
      <line x1="0" y1="0" x2="590" y2="0" stroke="#263238" stroke-width="5" stroke-linecap="round"/>
      <text x="0" y="34" font-size="15" text-anchor="middle">1</text><text x="590" y="34" font-size="15" text-anchor="middle">100</text>
      <circle cx="295" cy="0" r="10" fill="#e76f51"/><text x="295" y="-22" font-size="16" text-anchor="middle">50?</text>
      <text x="0" y="-22" font-size="16">1回目</text>
    </g>
    <g transform="translate(86 155)">
      <line x1="295" y1="0" x2="590" y2="0" stroke="#8ecae6" stroke-width="12" stroke-linecap="round" opacity=".75"/>
      <line x1="0" y1="0" x2="590" y2="0" stroke="#ddd" stroke-width="2"/>
      <circle cx="442" cy="0" r="10" fill="#e76f51"/><text x="442" y="-22" font-size="16" text-anchor="middle">75?</text>
      <text x="0" y="-22" font-size="16">2回目</text><text x="445" y="34" font-size="15" text-anchor="middle">51〜100</text>
    </g>
    <g transform="translate(86 218)">
      <line x1="295" y1="0" x2="442" y2="0" stroke="#90be6d" stroke-width="12" stroke-linecap="round" opacity=".75"/>
      <line x1="0" y1="0" x2="590" y2="0" stroke="#ddd" stroke-width="2"/>
      <circle cx="366" cy="0" r="10" fill="#e76f51"/><text x="366" y="-22" font-size="16" text-anchor="middle">62?</text>
      <text x="0" y="-22" font-size="16">3回目</text><text x="370" y="34" font-size="15" text-anchor="middle">51〜74</text>
    </g>
    <g transform="translate(86 281)">
      <line x1="366" y1="0" x2="442" y2="0" stroke="#ffd166" stroke-width="12" stroke-linecap="round" opacity=".9"/>
      <line x1="0" y1="0" x2="590" y2="0" stroke="#ddd" stroke-width="2"/>
      <circle cx="404" cy="0" r="10" fill="#e76f51"/><text x="404" y="-22" font-size="16" text-anchor="middle">68?</text>
      <text x="0" y="-22" font-size="16">4回目</text><text x="404" y="34" font-size="15" text-anchor="middle">63〜74</text>
    </g>
  </g>
  <text x="126" y="352" font-family="sans-serif" font-size="16" fill="#555">100個あっても、2⁷=128 なので7回以内に1つまで絞れる。</text>
</svg>
