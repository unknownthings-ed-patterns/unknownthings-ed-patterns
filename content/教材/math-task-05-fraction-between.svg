<svg xmlns="http://www.w3.org/2000/svg" width="760" height="260" viewBox="0 0 760 260" role="img" aria-labelledby="title desc">
  <title id="title">1/2と2/3の間の分数</title>
  <desc id="desc">数直線上で1/2、3/5、7/12、2/3を比較する図。</desc>
  <rect width="760" height="260" fill="#fbfaf7"/>
  <text x="38" y="42" font-family="sans-serif" font-size="24" font-weight="700" fill="#2b2b2b">1/2 と 2/3 の間を探す</text>
  <line x1="70" y1="130" x2="690" y2="130" stroke="#263238" stroke-width="4"/>
  <g font-family="sans-serif" font-size="18" fill="#333" text-anchor="middle">
    <g><line x1="380" y1="110" x2="380" y2="150" stroke="#457b9d" stroke-width="4"/><text x="380" y="178">1/2</text></g>
    <g><line x1="442" y1="104" x2="442" y2="156" stroke="#2a9d8f" stroke-width="4"/><text x="442" y="95">3/5</text></g>
    <g><line x1="483" y1="104" x2="483" y2="156" stroke="#e76f51" stroke-width="4"/><text x="483" y="95">7/12</text></g>
    <g><line x1="587" y1="110" x2="587" y2="150" stroke="#457b9d" stroke-width="4"/><text x="587" y="178">2/3</text></g>
  </g>
  <path d="M380 205 C420 228, 545 228, 587 205" fill="none" stroke="#e9c46a" stroke-width="5"/>
  <text x="485" y="238" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#555">間には、まだ分数を入れられる</text>
</svg>
