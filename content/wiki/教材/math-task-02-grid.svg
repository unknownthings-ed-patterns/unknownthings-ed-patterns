<svg xmlns="http://www.w3.org/2000/svg" width="720" height="360" viewBox="0 0 720 360" role="img" aria-labelledby="title desc">
  <title id="title">3×3のマス目に隠れた正方形</title>
  <desc id="desc">1×1、2×2、3×3の正方形を大きさ別に数えるための模式図。</desc>
  <rect width="720" height="360" fill="#fbfaf7"/>
  <text x="40" y="42" font-family="sans-serif" font-size="24" font-weight="700" fill="#2b2b2b">正方形を大きさ別に見る</text>
  <g transform="translate(70 85)" stroke="#263238" stroke-width="3" fill="none">
    <rect x="0" y="0" width="180" height="180"/>
    <path d="M60 0v180M120 0v180M0 60h180M0 120h180"/>
    <rect x="0" y="0" width="60" height="60" fill="#7bc8a4" opacity=".55"/>
    <rect x="60" y="60" width="120" height="120" fill="#ffd166" opacity=".48"/>
    <rect x="0" y="0" width="180" height="180" stroke="#ef476f" stroke-width="6" opacity=".75"/>
  </g>
  <g font-family="sans-serif" font-size="18" fill="#333">
    <rect x="310" y="90" width="330" height="52" rx="6" fill="#7bc8a4" opacity=".25"/>
    <text x="330" y="123">1×1：左上を変えて数える</text>
    <rect x="310" y="155" width="330" height="52" rx="6" fill="#ffd166" opacity=".28"/>
    <text x="330" y="188">2×2：置ける場所はどこ？</text>
    <rect x="310" y="220" width="330" height="52" rx="6" fill="#ef476f" opacity=".16"/>
    <text x="330" y="253">3×3：全体も正方形</text>
  </g>
  <text x="70" y="310" font-family="sans-serif" font-size="16" fill="#555">小さいものだけで止めず、「大きさ」と「左上の位置」で体系的に数える。</text>
</svg>
